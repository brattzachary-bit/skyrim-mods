; Door Preloader - loads what lies behind a door before you open it
; Changes apply on the next game start.

[General]
bEnabled = 1
; Start loading a door's destination when you are this close to it (game units; 1800 is about 25 m).
fDistance = 1800
; How often nearby doors are checked, in milliseconds.
uScanMs = 400
; How many destinations may be prepared at once (nearest doors first).
iMaxTargets = 2
; Count a door behind you as up to three times as far away as one straight ahead, so the place you are
; walking towards is prepared first. Within a few steps of a door the direction is ignored.
bPreferDoorsAhead = 1
; A destination nobody is near any more is let go after this many seconds.
uKeepSeconds = 45

[Loading]
; For doors that lead outside: prepare the cells this far around the arrival point (2 = 5x5 cells, as the game loads).
iExteriorRadius = 2
; Also prepare the people who live there: skeleton, head, skin and the armour of their default outfit.
bCharacters = 1
; Upper limit of models prepared per destination.
uMaxModels = 1500
; Background threads that load models. 0 = load on the game's own thread in small slices instead (safer, slower, may hitch).
iLoaderThreads = 1
; Stutter brake: loading pauses while the game's frames run this many times longer than normal
; (1.35 = 35 % longer). Lower is more careful, 0 switches the brake off.
fStutterGuard = 1.35
; Only with iLoaderThreads = 0: time per frame spent loading, in milliseconds.
fMainThreadBudgetMs = 2.0

[Log]
; Write where you arrived and how much of it had been prepared, how long each door took from use to arrival,
; and how long any loading screen was up.
bLoadTimes = 1
