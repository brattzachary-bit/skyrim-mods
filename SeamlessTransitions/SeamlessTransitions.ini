; ---- ease-in ----------------------------------------------------------------
; The held picture pushes forward very slowly until the new place has been swapped in, stands still across
; the swap, and the dissolve carries on from exactly where it stopped.
; time for the push-in to build up (ms)
uSeamlessEaseInMs = 4000
; how far it pushes forward over that time (0.008 = 0.8 %)
fSeamlessPushIn = 0.008
; further push per second
fSeamlessDrift = 0.003
; hide the HUD from just before the door until the dissolve starts, so the "Open" prompt is not in the held picture
bSeamlessHideHud = 1
; frames between the key press and the door actually opening (the HUD is hidden in that time)
uSeamlessDoorDelayFrames = 3

; ---- transition styles -------------------------------------------------------
; Which cover each kind of load gets: 0 = vanilla loading screen / none, 1 = eyes, 2 = ink, 4 = fade to black,
; 5 = light, 6 = drowsy, 7 = soul mist. With MCM Helper installed the config page sets these instead.
iStyleFastTravel = 1
iStyleCarriage = 4
iStyleOther = 1
iStyleBlackBook = 2
iStyleSoulCairn = 7
; waking up after sleeping (no load involved); 0 = off
iStyleSleep = 6
; 8 = wipe. Dwemer lifts; portals (wayshrines, Sovngarde, Skuldafn, Azura's Star); jail / abduction / blackout; rowboat. 0 = no special handling
iStyleLift = 8
iStylePortal = 5
iStyleCaptive = 6
iStyleBoat = 4
; 9 = dream. The Mind of Madness and the Dreamstride
iStyleDream = 9
; 10 = dissolve (the door look) for any of the styles above. Ordinary doors: 0 = hold and dissolve, or any style number
iStyleDoor = 0
; EXPERIMENTAL: also pause NVIDIA DLSS frame generation (Streamline) while a transition is on screen
bPauseDlssFrameGen = 0
; Tell other mods that a load happened although no loading screen opened (DynDOLOD needs this for its dynamic LOD)
bAnnounceLoads = 1
