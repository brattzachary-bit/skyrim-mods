; Seamless Door and Travel Transitions — configuration (based on LoadingFlow 1.2.0)
;
; This file is rewritten on every menu change ([Menu] lines are preserved verbatim), so edit it
; while the game is closed. Every key below also appears somewhere in the in-game menu
; (SKSEMenuFramework → Seamless Transitions; most settings are also on the MCM page), which is the easier way to change things.
;
; THE KEYS THAT ACTUALLY MATTER
;   [General] Door transition look .... fDeadBlurPx / uCrossFadeMs / uCrossFadeHoldMs
;   [General] Speed vs stability ..... fPostLoadUpdateTimeMS / iLoadingQueuedPriorityBudgetMs / fFadeToBlackFadeSeconds
;   [General] Hiding the menu ........ bSuppressLoadingMenu / iSuppressMode / uSuppressTimeoutMs
; Everything else is either a fixed default or a diagnostic; the comments say which.
[General]
; ---- master -------------------------------------------------------------------------------
bEnabled = 1
bAllowInteriorToInterior = 1
bAllowPocketToExterior = 1

; ---- LEGACY pocket / clone route: NOT FUNCTIONAL, leave everything here alone ---------------
; The plugin stopped faking cells: every load door now uses the engine's own cell change, so
; navmesh, AI packages, radiant quests and location discovery stay vanilla. These keys are what is
; left of the old clone route and exist only so an A/B test can still be run. Do not enable them.
bUsePocketCopies = 0
bMoveActorsToPocket = 0
bSpawnBlackBoxShell = 1
uMaxPocketSlots = 8
uMaxRefsPerCell = 800
fBaseAltitudeZ = 26000.0
fSlotStepZ = 3500.0
uDoorOpenDelayMs = 260
; Faking events for scripts that wait on cell/location changes. Both reach other mods' SKSE sinks;
; bFakeCellLoadEvents can fan out far beyond the player. Test-only, keep at 0.
bFakeLocationEvents = 0
bFakeCellLoadEvents = 0

; ---- door feel ------------------------------------------------------------------------------
bPlayDoorSoundAndAnim = 1
; Hold Sneak while activating a door to get the vanilla load screen for that one door.
bSneakForcesVanillaLoad = 1
; Top-left HUD note on every transition. Handy while tuning, noisy once you trust it.
bShowDebugNotifications = 0
bTriggerBlinkImod = 0
fBlinkStrength = 1.00

; ---- hiding the loading menu (the whole point of the plugin) --------------------------------
bSuppressLoadingMenu = 1
; 0 = never touch the menu, 1 = drop the Show from door transitions. (2 was retired and is clamped to 1.)
iSuppressMode = 1
; Safety net: if the transition never reports back, the menu is handed back after this long.
uSuppressTimeoutMs = 6000
uTransitionWindowMs = 10000
; Also suppress non-door transitions (fast travel, coc). Off by default: those have no door to hide.
bGlobalMenuSuppression = 0

; ---- prewarming -----------------------------------------------------------------------------
bPrewarmNearbyDoors = 1
uPrewarmModelCap = 200
fPrewarmRadius = 800

; ---- speed vs stability: real engine timers -------------------------------------------------
; These decide how long scripts and streaming get before the player takes control, not just how
; the transition looks. The menu has three presets (Stable / Balanced / Fastest) and an "apply now"
; button. Changing them in the INI needs a full restart -- the engine reads them at load.
bTweakEngineTimers = 1
fFadeToBlackFadeSeconds = 0.40
fNormalDoorFadeSecs = 0.10
fNormalDoorFadeWait = -1
fAutoDoorFadeSecs = 0.10
fMinSecondsForLoadFadeIn = 0.00
fPostLoadUpdateTimeMS = 800.0
fActorTeleportFadeSeconds = 0.10
iPreloadSizeLimit = -1
fFastTravelFadeSecs = -1
iLoadingQueuedPriorityBudgetMs = 20

bLogDoorActivations = 0

; ---- NO-BLACK (freeze) -- read this before turning it on ------------------------------------
; When ON, the plugin withholds the frame during a transition so the last picture stays on screen
; instead of the engine's fade to black. It looks better, but it is also the one feature that can
; leave a slow load looking like a freeze: the picture stays put while the HUD is off and player
; controls are not restored yet. Two users hit exactly that on 1.2.1, on cells that took unusually
; long to load.
; 1.2.1 shipped with these ON and no way to turn them off. 1.3.0 ships them OFF by default: the
; transition uses the engine's own fade, which is what vanilla does and cannot get stuck.
bNoBlackTransition = 0
bNoBlackOnlyForManualDoors = 0
bNoBlackForWalkThrough = 0

; ---- THE DOOR TRANSITION LOOK -- OPT-IN SINCE 1.3.1 -------------------------------------
; The whole visual layer is OFF by default from 1.3.1: iVisualMode is 0 below.
; Why: 1.3.0 shipped it on, and a crash report came in on a vanilla interior that had not shown up
; on 1.2.1. The visual layer is the one part of this plugin that touches Direct3D every frame, so it
; is the first thing to rule out. Nothing else in the plugin depends on it.
; What you lose while it is off: the held picture no longer blurs; you get the engine's own fade
; instead. What still works: the loading screen stays hidden, the timers stay trimmed, pre-warming
; stays on, and the softlock fixes from 1.3.0 stay in place.
; To try it: set iVisualMode = 1 and use a door. If the game is stable for a while, keep it. If you
; crash, set it back to 0 and report it -- that one line is enough to tell me where it happens.

; ---- THE DOOR TRANSITION LOOK -----------------------------------------------------------------
; The dead window is one frozen picture for up to ~2 s, then the new cell appears.
; Two independent knobs:
;   fDeadBlurPx  — how blurry that frozen picture gets while you wait ("frosted glass"). The
;                  push-in that used to be here was judged bad in game: a still picture that keeps
;                  moving towards you reads as a lurch. Losing focus keeps the frame still.
;   uCrossFadeMs — how long the dissolve itself lasts.
;   uCrossFadeHoldMs — how long we are willing to WAIT for the engine to unveil the new picture
;                  before starting that dissolve.
;                  Why wait: the engine does not show the finished cell at the swap. Measured here it
;                  sits on a dark frame (luma ~35) for ~800 ms -- exactly fPostLoadUpdateTimeMS -- and
;                  then jumps straight to the real scene (luma ~110). A dissolve on a stopwatch always
;                  ends before that jump, so the jump lands uncovered and reads as a bright flash.
;                  Instead we watch the picture and start dissolving the moment it changes.
; All five have sliders in the menu under "Door transition look"; no restart needed.
fDeadBlurPx = 40.0
; How long the blur takes to build up. Must not outlast the dead window (~124 frames ≈ 2000 ms).
uDeadZoomMs = 4000
; Push-in as a fraction (0.050 = 5%), stacking with the blur. Set to 0.000 to disable it.
fDeadZoomAmount = 0.050
; How long the dissolve lasts (0..800), and how long we are willing to wait for the engine's picture
; to come back before starting it (0..6000). The wait is event-driven: the dissolve starts the moment
; the engine's frame is no longer black, which is what stops it from fading into the dark frame the
; engine shows right after the swap. Raise the wait only if the hand-over starts too early.
; The wait is event-driven, not a stopwatch: the dissolve starts the moment the engine's frame is
; both non-black AND settled between two samples. That is what stops the dissolve from fading into
; the black frame the engine presents right after the swap -- which is what made the new cell appear
; as a bright flash.
uCrossFadeMs = 0
uCrossFadeHoldMs = 0

; bCancelFadeBackAfterCut (v1.10.4, EXPERIMENT, default 0)
; After the swap the engine's picture sits at about half brightness (~35 vs ~110 later) for ~800 ms
; and then steps to the real scene. The log rules out fPostLoadUpdateTimeMS (104 ms) and rules out a
; fade ramp (the value is constant). We already stop FadeToBlack + FadeToBlackHold every step,
; including at the cut; the only form never touched is FadeToBlackBackImod, because cancelling it
; mid-transition restarts the engine's fade-in every 25 ms and strobes.
; Set this to 1 to cancel all three for 1.5 s AFTER the cut only. If the dark step disappears, the
; still picture was a black plane held at partial strength; if nothing changes, the new cell simply
; renders that dark until it is ready and no record is to blame.
bCancelFadeBackAfterCut = 0

; ---- SEAMLESS DOOR TRANSITION ----------------------------------------------
; Keeps the last frame of the old cell on screen through the whole load (the engine's fade, the dead
; window and the scene spin all happen underneath it), then dissolves it into the new cell once the
; engine's picture is back and has stopped changing. Sliders for all of this are in the in-game menu.
bSeamless = 1
; How long the dissolve lasts (100..2000).
uSeamlessFadeMs = 600
; Earliest the dissolve may start after the cell swap. 0 = fPostLoadUpdateTimeMS + 100, which skips the
; dark frame the engine shows during its post-load script wait.
uSeamlessMinAfterCutMs = 0
; The new picture must hold still (luma change <= fSeamlessStableTol per frame) this long first.
uSeamlessStableMs = 120
; Safety: dissolve anyway this long after the swap, even if the picture never settles.
uSeamlessMaxHoldMs = 3000
fSeamlessBlackLuma = 6.0
fSeamlessStableTol = 3.0

; ---- travel effects: non-door loads get a cover instead of the loading screen
; eyes = boats, carriages, dialogue/scripted travel; ink = Black Books, Soul Cairn; magic = map fast travel.
; Loading a save, dying and new game always keep the vanilla loading screen.
bTravelFx = 1
; 1 = unrecognised travel loads also get the eyes, 0 = they keep the vanilla loading screen
iTravelFxDefault = 1
uTravelFxInMs = 450
uTravelFxOutMs = 900
uTravelFxMaxHoldMs = 45000
; fast travel: the map closes onto your current spot, the magic builds over it for this long (with a sound), then the travel starts
uTravelFxMagicInMs = 1000
; fast travel cover: 1 = eyes close and open, 2 = the magic field
iTravelFxFastTravel = 1
bTravelFxSounds = 1
; log per-frame luma before/after our draw for 1.2 s after each door cut (diagnostic)
bSeamlessTrace = 0
; switch FSR frame generation off while a hold/cover is on screen and reset it after (fixes the one-frame flash of the new area)
bPauseFrameGen = 1
; present no frames while the held picture is static (door hold, travel hold across the cell swap): the frame generator never sees the cut
bHoldPresents = 1

; ---- submit route ---------------------------------------------------------------------------
; Which way the frames carrying our pixels reach the screen.
;   0 = slot 8 only. On this machine slot 8 has never delivered them: the present there is not
;       synchronous, so the buffer is overwritten before it is flipped.
;   1 = slot 22 while the dead window is static, slot 8 from the cut on. Comparison only.
;   2 = slot 22 on every drawn frame (verified stable in game).
; bUsePresent1ForVisual only applies when iSubmitRoute is 0; kept so old INIs still work.
iSubmitRoute = 2
bUsePresent1ForVisual = 0

; ---- diagnostics ----------------------------------------------------------------------------
; iVisualMode 0 = off (the Present hook draws nothing at all). 1 = the real effect.
; The rest are probes from the round that established which submit route works; they flood the
; screen magenta so no post-processing chain can hide them. 3 = current buffer, 6 = via slot 22,
; 7 = every back buffer, 8 = 7 plus a read-back after the chain (did anything rewrite our frame?).
; 4 = flood after the real Present. Log lines: [Probe] / [Chain] / [PA].
iVisualMode = 0
uProbeFrames = 90
; Present audit: every 15th drawn frame logs whether DXGI counted the Present we forwarded.
bPresentAudit = 0
; Chain probe: one line naming the module that owns slot 8 / slot 22 below us. Read-only.
bCapProbe = 0
; bProbeAssembly / uProbeAssemblyMs — legacy probes from an earlier investigation that has since
; been closed (the apparent rotation came from a third-party camera mod, not the engine).
; The keys are kept only so older configs keep loading; they have nothing left to measure.
bProbeAssembly = 0
uProbeAssemblyMs = 2500
bProbeGfx = 0
bProbeWorld = 0
; Framebuffer capture to BMP in the game folder. Off in every shipped package.
bCaptureFrame = 0
bCaptureLiveFrames = 0
uCaptureFrames = 16
uCaptureEveryMs = 150
uCaptureTotalMax = 48

